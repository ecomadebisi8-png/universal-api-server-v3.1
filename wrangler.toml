name = "universal-api-server-v3"
main = "src/index.ts"
compatibility_date = "2024-05-29"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
# JWT_SECRET is a worker secret: set via `wrangler secret put JWT_SECRET`
# (never committed to wrangler.toml)

[[d1_databases]]
binding = "DB"
database_name = "universal-api-db"
database_id = "7485bcbd-91cc-4c5e-98a0-282e84b0c153"

# Daily housekeeping: prune old api_logs (30d) and stale rate-limit rows
[triggers]
crons = ["0 4 * * *"]
